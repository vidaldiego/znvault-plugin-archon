name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: archon-plugin-npm-publication
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Node.js
        # Omit registry-url so npm Trusted Publishing uses GitHub OIDC rather
        # than a generated classic-token stanza.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install OIDC-capable npm
        run: npm install -g npm@11.17.0
      - name: Verify release identity
        run: node scripts/check-release.mjs "$GITHUB_REF_NAME"
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build production package
        run: npm run build:prod
      - name: Pack and verify the installable artifact
        shell: bash
        run: |
          ARTIFACT_DIR="$RUNNER_TEMP/archon-plugin-release"
          PACK_RESULT="$RUNNER_TEMP/archon-plugin-pack.json"
          mkdir -p "$ARTIFACT_DIR"
          npm pack --ignore-scripts --pack-destination "$ARTIFACT_DIR" --json > "$PACK_RESULT"
          FILE=$(node -p "require(process.env.RUNNER_TEMP + '/archon-plugin-pack.json')[0].filename")
          PACKAGE_PATH="$ARTIFACT_DIR/$FILE"
          node scripts/verify-package.mjs "$PACKAGE_PATH" "${GITHUB_REF_NAME#v}"
          sha256sum "$PACKAGE_PATH" > "$RUNNER_TEMP/archon-plugin-package.sha256"
          printf 'PACKAGE_PATH=%s\n' "$PACKAGE_PATH" >> "$GITHUB_ENV"
      - name: Preserve verified artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archon-plugin-package-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/archon-plugin-release/*.tgz
            ${{ runner.temp }}/archon-plugin-package.sha256
          if-no-files-found: error
      - name: Publish the verified tarball with OIDC
        shell: bash
        run: |
          sha256sum --check "$RUNNER_TEMP/archon-plugin-package.sha256"
          npm publish "$PACKAGE_PATH" --ignore-scripts --access public --provenance

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          generate_release_notes: true
          draft: false
